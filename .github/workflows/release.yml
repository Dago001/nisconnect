name: Release

# Builds the production web app, Android (APK + AAB) and iOS apps.
#
#   * Push a tag like v1.0.0  -> builds everything and attaches the files to a
#     GitHub Release named after the tag. The server address comes from the
#     repository variable SERVER_URL (Settings > Secrets and variables >
#     Actions > Variables), e.g. https://connect.example.gov.ng
#   * Actions > Release > Run workflow -> same builds for the server_url you
#     type in; files are kept as workflow artifacts (no GitHub Release).
#
# Signing (all optional; without them you still get working test builds):
#   Android (Settings > Secrets and variables > Actions > Secrets):
#     ANDROID_KEYSTORE_BASE64    upload keystore (.jks), base64-encoded
#     ANDROID_KEYSTORE_PASSWORD  keystore password
#     ANDROID_KEY_ALIAS          key alias, e.g. upload
#     ANDROID_KEY_PASSWORD       key password (often the same as the keystore's)
#     -> without them the APK/AAB are signed with a debug key (fine for
#        testing, NOT accepted by Google Play).
#   iOS:
#     IOS_CERTIFICATE_P12_BASE64      "Apple Distribution" certificate + private
#                                     key exported from Keychain as .p12, base64
#     IOS_CERTIFICATE_PASSWORD        password chosen when exporting the .p12
#     IOS_PROVISIONING_PROFILE_BASE64 App Store provisioning profile for
#                                     ng.gov.immigration.nisconnect, base64
#     IOS_TEAM_ID                     10-character Apple Developer Team ID
#     (optional, to upload to TestFlight automatically)
#     APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#     APP_STORE_CONNECT_API_KEY_BASE64 (the AuthKey_XXXX.p8 file, base64)
#     -> without the first four, an unsigned Runner.app is built instead
#        (proves the build works; cannot be installed on phones).
#   Encode a file with:  base64 -w0 file > file.b64   (macOS: base64 -i file)
#   Full walkthrough: docs/GO_LIVE.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server address the apps connect to, e.g. https://connect.example.gov.ng"
        required: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"

defaults:
  run:
    working-directory: mobile

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      defines: ${{ steps.cfg.outputs.defines }}
      version_args: ${{ steps.cfg.outputs.version_args }}
      label: ${{ steps.cfg.outputs.label }}
    steps:
      - id: cfg
        working-directory: .
        env:
          SERVER_URL: ${{ inputs.server_url || vars.SERVER_URL }}
          WS_KEY: ${{ vars.WS_KEY || 'nisconnect' }}
        run: |
          set -euo pipefail
          url="${SERVER_URL%/}"
          url="${url%/api/v1}"
          if [ -z "$url" ]; then
            echo "::error::No server address. Set the repository variable SERVER_URL (e.g. https://connect.example.gov.ng) or run the workflow manually with server_url."
            exit 1
          fi
          case "$url" in
            https://*) scheme=wss; default_port=443 ;;
            http://*)  scheme=ws;  default_port=80
                       echo "::warning::$url is not https; release Android/iOS builds only allow https." ;;
            *) echo "::error::server_url must start with https://"; exit 1 ;;
          esac
          hostport="${url#*://}"; hostport="${hostport%%/*}"
          host="${hostport%%:*}"
          if [ "$hostport" != "$host" ]; then port="${hostport##*:}"; else port="$default_port"; fi
          echo "defines=--dart-define=API_BASE_URL=$url/api/v1 --dart-define=WS_HOST=$host --dart-define=WS_PORT=$port --dart-define=WS_SCHEME=$scheme --dart-define=WS_KEY=$WS_KEY" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            echo "version_args=--build-name=$name --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "label=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version_args=--build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "label=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
          echo "Server: $url  (websocket $scheme://$host:$port, key $WS_KEY)"

  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    needs: [prepare, analyze-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # No API_BASE_URL on purpose: served by the production stack, the web app
      # talks to the domain it was loaded from, so this zip works on any domain
      # (unzip into infrastructure/production/web with WEB_SOURCE=prebuilt).
      - run: >-
          flutter build web --release --no-web-resources-cdn
          --dart-define=WS_KEY=${{ vars.WS_KEY || 'nisconnect' }}
          ${{ needs.prepare.outputs.version_args }}
      - name: Zip
        run: cd build/web && zip -qr "$GITHUB_WORKSPACE/nisconnect-web-${{ needs.prepare.outputs.label }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: nisconnect-web-*.zip

  android:
    needs: [prepare, analyze-test]
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Signing mode
        id: signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"; echo "Signing with the release keystore"
          else
            echo "suffix=-debug-signed" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets not set: APK/AAB are debug-signed (testing only, not accepted by Google Play)."
          fi
      # build.gradle.kts reads the ANDROID_* variables above (or android/key.properties).
      - run: flutter build apk --release ${{ needs.prepare.outputs.defines }} ${{ needs.prepare.outputs.version_args }}
      - run: flutter build appbundle --release ${{ needs.prepare.outputs.defines }} ${{ needs.prepare.outputs.version_args }}
      - name: Collect
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/out/nisconnect-${{ needs.prepare.outputs.label }}${{ steps.signing.outputs.suffix }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/nisconnect-${{ needs.prepare.outputs.label }}${{ steps.signing.outputs.suffix }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  ios:
    needs: [prepare, analyze-test]
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      BUNDLE_ID: ng.gov.immigration.nisconnect
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Signing mode
        id: mode
        run: |
          if [ -n "$IOS_CERTIFICATE_P12_BASE64" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$IOS_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing secrets not set: building an unsigned Runner.app (cannot be installed or uploaded)."
          fi

      # ---- Signed: .ipa for App Store Connect / TestFlight -------------------
      - name: Install certificate and provisioning profile
        if: steps.mode.outputs.signed == 'true'
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Configure manual signing for the Runner target
        if: steps.mode.outputs.signed == 'true'
        run: |
          set -euo pipefail
          # Only the app target (exact bundle id); pods / Swift packages are untouched.
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $IOS_TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"; CODE_SIGN_IDENTITY = \"Apple Distribution\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";|" \
            ios/Runner.xcodeproj/project.pbxproj
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Build .ipa
        if: steps.mode.outputs.signed == 'true'
        run: |
          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            ${{ needs.prepare.outputs.defines }} ${{ needs.prepare.outputs.version_args }}
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/ios/ipa/*.ipa "$GITHUB_WORKSPACE/out/nisconnect-${{ needs.prepare.outputs.label }}.ipa"

      - name: Upload to TestFlight
        if: steps.mode.outputs.signed == 'true' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_API_KEY_BASE64 != ''
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            --file "$GITHUB_WORKSPACE/out/nisconnect-${{ needs.prepare.outputs.label }}.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # ---- Unsigned: proves the release build compiles ----------------------
      - name: Build unsigned Runner.app
        if: steps.mode.outputs.signed != 'true'
        # Device builds without a signing team can fail on Swift-package
        # resource bundles (see mobile.yml); don't fail the whole release.
        continue-on-error: true
        run: |
          flutter build ios --release --no-codesign \
            ${{ needs.prepare.outputs.defines }} ${{ needs.prepare.outputs.version_args }}
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd build/ios/iphoneos
          zip -qry "$GITHUB_WORKSPACE/out/nisconnect-${{ needs.prepare.outputs.label }}-unsigned-Runner.app.zip" Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*
          if-no-files-found: warn

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/cert.p12 "$RUNNER_TEMP"/profile.* "$HOME"/.appstoreconnect/private_keys/*.p8

  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.web.result == 'success' && needs.android.result == 'success'
    needs: [prepare, web, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist
          # The unsigned iOS build is only a compile check; keep it out of the release.
          find dist -name '*-unsigned-Runner.app.zip' -delete
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "NISconnect $TAG" --generate-notes --verify-tag
          fi
