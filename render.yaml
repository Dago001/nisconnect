# Render Blueprint: a free test deployment of the NISconnect API so the mobile
# app and website can reach a real https server.
#   Render dashboard > New > Blueprint > pick this repo (and branch) > Apply.
# The API then lives at https://<service-name>.onrender.com; enter that under
# "Server address" in the app.
#
# This is a TEST setup: the demo personnel provider (any Service Number is
# accepted as a test officer), OTP codes shown in the app instead of SMS, no websockets,
# calls or push. See docs/DEPLOYMENT.md for production.

services:
  - type: web
    name: nisconnect-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: NISconnect
      - key: APP_ENV
        value: staging          # demo personnel provider refuses "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true     # converted to Laravel's format at start-up
      - key: LOG_CHANNEL
        value: stderr
      - key: TRUSTED_PROXIES
        value: "*"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: nisconnect-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
      # Uploads (APK releases, avatars, message media) are written under this
      # path, which is the mount point of the persistent disk below. Without
      # it they live in the container filesystem, which Render discards on
      # every deploy, restart and sleep/wake — the database row survives while
      # the file does not, so an uploaded APK silently stops being offered.
      - key: NISCONNECT_STORAGE_ROOT
        value: /var/data/storage
      - key: PERSONNEL_PROVIDER
        value: demo
      - key: PERSONNEL_DEMO_ACCEPT_ANY
        value: "true"           # test only: any Service Number can register
      - key: OTP_DRIVER
        value: log
      - key: OTP_EXPOSE_IN_RESPONSE
        value: "true"           # test only: no SMS gateway configured
      - key: PUSH_DRIVER
        value: log
    # Keeps uploads across deploys and restarts. Render's container filesystem
    # is discarded otherwise, which leaves AppRelease rows pointing at files
    # that no longer exist and the download page saying "available soon".
    disk:
      name: nisconnect-storage
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: nisconnect-db
    plan: free
    databaseName: nisconnect
    user: nisconnect
