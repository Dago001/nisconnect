# ---- NISconnect web app (added by infrastructure/shared-hosting/build-package.sh)
# "/" opens the officer web app; Laravel handles everything that is not a file.
DirectoryIndex index.html index.php

# The web app's entry files are re-checked on every visit, so officers get a
# new version straight after an update; the other files can be cached.
<IfModule mod_headers.c>
    <FilesMatch "^(index\.html|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|flutter_service_worker\.js|manifest\.json|version\.json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Browsers are sent to https (behind the host's proxy, X-Forwarded-Proto says so).
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteCond %{HTTP:X-Forwarded-Proto} !=https
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</IfModule>
# ---- end NISconnect web app

