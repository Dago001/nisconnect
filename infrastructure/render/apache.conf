# Apache settings for the Render image (infrastructure/render/Dockerfile).
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/public>
    # "/" opens the Flutter web app; Laravel handles everything that is not a file.
    DirectoryIndex index.html index.php
</Directory>

# The web app's entry files must be re-checked on every visit so officers get
# a new version straight after a deploy; versioned assets can be cached.
<FilesMatch "^(index\.html|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|flutter_service_worker\.js|manifest\.json|version\.json)$">
    Header set Cache-Control "no-cache"
</FilesMatch>

# Static files only: Laravel sets its own security headers on the pages it serves.
<If "-f %{REQUEST_FILENAME} && %{REQUEST_FILENAME} !~ /\.php$/">
    Header set X-Content-Type-Options "nosniff"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    Header set Strict-Transport-Security "max-age=31536000"
</If>
